# enterprise-ai-agent-platform/helm/ai-agent-platform/templates/servicemonitor.yaml
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ai-agent-platform.fullname" . }}-api
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
    component: api
spec:
  selector:
    matchLabels:
      {{- include "ai-agent-platform.selectorLabels" . | nindent 6 }}
      component: api
  endpoints:
    - port: http
      path: /health/metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'process_cpu_seconds_total|process_resident_memory_bytes|nodejs_eventloop_lag_seconds'
          action: keep
      relabelings:
        - sourceLabels: [namespace, pod]
          separator: /
          targetLabel: instance
          replacement: $1/$2
          action: replace
---
{{- if .Values.frontend.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ai-agent-platform.fullname" . }}-frontend
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
    component: frontend
spec:
  selector:
    matchLabels:
      {{- include "ai-agent-platform.selectorLabels" . | nindent 6 }}
      component: frontend
  endpoints:
    - port: http
      path: /health
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
---
{{- if .Values.worker.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ai-agent-platform.fullname" . }}-worker
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
    component: worker
spec:
  selector:
    matchLabels:
      {{- include "ai-agent-platform.selectorLabels" . | nindent 6 }}
      component: worker
  endpoints:
    - port: http
      path: /health/metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- end }}