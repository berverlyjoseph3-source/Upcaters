# enterprise-ai-agent-platform/helm/ai-agent-platform/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-agent-platform.fullname" . }}-api
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
    component: api
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: {{ .Values.app.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "ai-agent-platform.selectorLabels" . | nindent 4 }}
    component: api
---
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-agent-platform.fullname" . }}-frontend
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
    component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "ai-agent-platform.selectorLabels" . | nindent 4 }}
    component: frontend
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-agent-platform.fullname" . }}-postgres
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
    component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres
    release: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-agent-platform.fullname" . }}-redis
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
    component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: redis
    release: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-agent-platform.fullname" . }}-mongodb
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
    component: mongodb
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
      name: mongodb
  selector:
    app: mongodb
    release: {{ .Release.Name }}