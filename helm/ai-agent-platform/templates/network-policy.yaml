        - podSelector:
            matchLabels:
              {{- include "ai-agent-platform.selectorLabels" . | nindent 14 }}
              component: api
        - podSelector:
            matchLabels:
              {{- include "ai-agent-platform.selectorLabels" . | nindent 14 }}
              component: worker
      ports:
        - protocol: TCP
          port: 5432
