# enterprise-ai-agent-platform/helm/ai-agent-platform/templates/serviceaccount.yaml
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-agent-platform.serviceAccountName" . }}
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ai-agent-platform.fullname" . }}-leader-election
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ai-agent-platform.fullname" . }}-leader-election
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ai-agent-platform.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "ai-agent-platform.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ai-agent-platform.fullname" . }}-metrics-reader
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
rules:
  - nonResourceURLs:
      - "/metrics"
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ai-agent-platform.fullname" . }}-metrics-reader
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ai-agent-platform.fullname" . }}-metrics-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "ai-agent-platform.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}