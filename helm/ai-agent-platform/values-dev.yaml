# enterprise-ai-agent-platform/helm/ai-agent-platform/values-dev.yaml
# Development environment values

# Global settings
global:
  environment: development
  imageRegistry: local
  imagePullSecrets: []
  storageClass: standard

# Application settings
app:
  name: ai-agent-platform
  replicaCount: 1
  image:
    repository: ai-agent-platform/api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    - name: NODE_ENV
      value: "development"
    - name: LOG_LEVEL
      value: "debug"
    - name: SENTRY_DSN
      value: ""

# Worker settings
worker:
  enabled: true
  replicaCount: 1
  image:
    repository: ai-agent-platform/worker
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Frontend settings
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ai-agent-platform/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Database settings (using in-cluster for development)
postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
  auth:
    username: aiagent_user
    password: dev_password_123
    database: aiagent
  primary:
    persistence:
      enabled: false  # No persistence for dev
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  auth:
    password: dev_redis_123
  master:
    persistence:
      enabled: false
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: 7
  auth:
    username: admin
    password: dev_mongo_123
    database: aiagent
  persistence:
    enabled: false
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Ingress settings (disabled for development)
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

# Secrets (development defaults - override with --set)
secrets:
  databaseUrl: "postgresql://aiagent_user:dev_password_123@ai-agent-platform-postgres:5432/aiagent"
  redisUrl: "redis://default:dev_redis_123@ai-agent-platform-redis:6379"
  mongodbUrl: "mongodb://admin:dev_mongo_123@ai-agent-platform-mongodb:27017/aiagent"
  jwtSecret: "dev_jwt_secret_1234567890"
  jwtRefreshSecret: "dev_refresh_secret_1234567890"
  encryptionKey: "0123456789abcdef0123456789abcdef"
  openaiApiKey: "sk-xxxxxxxxxxxxxxxxxxxxxxxx"
  anthropicApiKey: ""
  googleAiApiKey: ""
  googleClientId: ""
  googleClientSecret: ""
  linkedinClientId: ""
  linkedinClientSecret: ""
  facebookAppId: ""
  facebookAppSecret: ""
  twitterApiKey: ""
  twitterApiSecret: ""
  braveSearchApiKey: ""
  openweathermapApiKey: ""
  perplexityApiKey: ""
  stripeSecretKey: ""
  stripeWebhookSecret: ""
  stripePublishableKey: ""
  sendgridApiKey: ""
  fromEmail: "dev@aiagentplatform.com"

# Autoscaling (disabled for development)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget (disabled for development)
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Network Policy (disabled for development)
networkPolicy:
  enabled: false

# ServiceMonitor (disabled for development)
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s

# ServiceAccount
serviceAccount:
  create: true
  name: ai-agent-platform-dev-sa
  annotations: {}