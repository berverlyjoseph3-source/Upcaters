# enterprise-ai-agent-platform/k8s/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-platform-api
  namespace: ai-agent-platform
  labels:
    app: ai-agent-platform
    component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
    - name: metrics
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: ai-agent-platform
    component: api
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-platform-worker
  namespace: ai-agent-platform
  labels:
    app: ai-agent-platform
    component: worker
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: ai-agent-platform
    component: worker
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-platform-frontend
  namespace: ai-agent-platform
  labels:
    app: ai-agent-platform
    component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: ai-agent-platform
    component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-platform-postgres
  namespace: ai-agent-platform
  labels:
    app: ai-agent-platform
    component: database
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: postgres
    release: ai-agent-platform
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-platform-redis
  namespace: ai-agent-platform
  labels:
    app: ai-agent-platform
    component: cache
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: redis
    release: ai-agent-platform
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-platform-mongodb
  namespace: ai-agent-platform
  labels:
    app: ai-agent-platform
    component: database
spec:
  type: ClusterIP
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP
  selector:
    app: mongodb
    release: ai-agent-platform