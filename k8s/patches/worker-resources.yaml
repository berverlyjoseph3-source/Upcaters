# enterprise-ai-agent-platform/k8s/patches/worker-resources.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-platform-worker
  namespace: ai-agent-platform
spec:
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
            - name: WORKER_CONCURRENCY
              value: "10"