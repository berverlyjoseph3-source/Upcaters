# enterprise-ai-agent-platform/k8s/secrets.yaml
# Note: In production, use Sealed Secrets or External Secrets Operator
# This file is for reference only - do not commit real secrets
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-platform-secrets
  namespace: ai-agent-platform
  labels:
    app: ai-agent-platform
    component: secrets
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://aiagent_user:${DB_PASSWORD}@postgres:5432/aiagent"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
  MONGODB_URL: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/aiagent"
  
  # JWT
  JWT_SECRET: "${JWT_SECRET}"
  JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
  ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
  
  # AI APIs
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
  GOOGLE_AI_API_KEY: "${GOOGLE_AI_API_KEY}"
  
  # OAuth
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
  GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
  LINKEDIN_CLIENT_ID: "${LINKEDIN_CLIENT_ID}"
  LINKEDIN_CLIENT_SECRET: "${LINKEDIN_CLIENT_SECRET}"
  FACEBOOK_APP_ID: "${FACEBOOK_APP_ID}"
  FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET}"
  TWITTER_API_KEY: "${TWITTER_API_KEY}"
  TWITTER_API_SECRET: "${TWITTER_API_SECRET}"
  TWITTER_ACCESS_TOKEN: "${TWITTER_ACCESS_TOKEN}"
  TWITTER_ACCESS_SECRET: "${TWITTER_ACCESS_SECRET}"
  TWITTER_BEARER_TOKEN: "${TWITTER_BEARER_TOKEN}"
  
  # Web Search
  BRAVE_SEARCH_API_KEY: "${BRAVE_SEARCH_API_KEY}"
  OPENWEATHERMAP_API_KEY: "${OPENWEATHERMAP_API_KEY}"
  PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}"
  
  # Task Management
  ASANA_ACCESS_TOKEN: "${ASANA_ACCESS_TOKEN}"
  MONDAY_API_KEY: "${MONDAY_API_KEY}"
  
  # Stripe
  STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
  STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
  STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY}"
  
  # Email
  SENDGRID_API_KEY: "${SENDGRID_API_KEY}"
  FROM_EMAIL: "noreply@aiagentplatform.com"
  
  # AWS
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AWS_S3_BUCKET: "ai-agent-platform-storage-prod"
  
  # Monitoring
  SENTRY_DSN: "${SENTRY_DSN}"
  DATADOG_API_KEY: "${DATADOG_API_KEY}"
  DATADOG_APP_KEY: "${DATADOG_APP_KEY}"