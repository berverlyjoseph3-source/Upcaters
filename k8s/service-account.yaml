# enterprise-ai-agent-platform/k8s/service-account.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent-platform-sa
  namespace: ai-agent-platform
  labels:
    app: ai-agent-platform
    component: service-account
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ai-agent-platform-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-agent-platform-leader-election
  namespace: ai-agent-platform
  labels:
    app: ai-agent-platform
    component: rbac
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-agent-platform-leader-election
  namespace: ai-agent-platform
  labels:
    app: ai-agent-platform
    component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-agent-platform-leader-election
subjects:
  - kind: ServiceAccount
    name: ai-agent-platform-sa
    namespace: ai-agent-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-agent-platform-metrics-reader
  labels:
    app: ai-agent-platform
    component: rbac
rules:
  - nonResourceURLs:
      - "/metrics"
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agent-platform-metrics-reader
  labels:
    app: ai-agent-platform
    component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-agent-platform-metrics-reader
subjects:
  - kind: ServiceAccount
    name: ai-agent-platform-sa
    namespace: ai-agent-platform