# enterprise-ai-agent-platform/k8s/cert-manager.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  namespace: cert-manager
  labels:
    app: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@aiagentplatform.com
    privateKeySecretRef:
      name: letsencrypt-prod-private-key
    solvers:
      - http01:
          ingress:
            class: nginx
            ingressTemplate:
              metadata:
                annotations:
                  kubernetes.io/ingress.class: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  namespace: cert-manager
  labels:
    app: cert-manager
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@aiagentplatform.com
    privateKeySecretRef:
      name: letsencrypt-staging-private-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ai-agent-platform-tls
  namespace: ai-agent-platform
  labels:
    app: ai-agent-platform
    component: tls
spec:
  secretName: ai-agent-platform-tls
  duration: 2160h  # 90 days
  renewBefore: 360h  # 15 days before expiry
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - api.aiagentplatform.com
    - app.aiagentplatform.com
    - staging-api.aiagentplatform.com
    - staging-app.aiagentplatform.com
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ai-agent-platform-staging-tls
  namespace: ai-agent-platform
  labels:
    app: ai-agent-platform
    component: tls
spec:
  secretName: ai-agent-platform-staging-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - staging-api.aiagentplatform.com
    - staging-app.aiagentplatform.com
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048