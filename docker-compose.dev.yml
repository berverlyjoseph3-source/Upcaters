# enterprise-ai-agent-platform/docker-compose.dev.yml
version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-agent-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiagent_dev
      POSTGRES_USER: aiagent_user
      POSTGRES_PASSWORD: dev_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiagent_user -d aiagent_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-agent-dev-network

  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass dev_redis_123
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-agent-dev-network

  mongodb:
    image: mongo:7
    container_name: ai-agent-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: dev_mongo_123
      MONGO_INITDB_DATABASE: aiagent_dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-agent-dev-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ai-agent-mailhog-dev
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - ai-agent-dev-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: ai-agent-api-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://aiagent_user:dev_password_123@postgres:5432/aiagent_dev
      REDIS_URL: redis://default:dev_redis_123@redis:6379
      MONGODB_URL: mongodb://admin:dev_mongo_123@mongodb:27017/aiagent_dev
      JWT_SECRET: dev_jwt_secret_1234567890
      JWT_REFRESH_SECRET: dev_refresh_secret_1234567890
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-dummy-key-for-dev}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-dummy-key}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-dummy-key}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-secret}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-dummy-id}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-dummy-secret}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-dummy-id}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-dummy-secret}
      TWITTER_API_KEY: ${TWITTER_API_KEY:-dummy-key}
      TWITTER_API_SECRET: ${TWITTER_API_SECRET:-dummy-secret}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-dummy-key}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-dummy-key}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-dummy-key}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-SG.dummy}
      FROM_EMAIL: dev@aiagentplatform.com
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      APP_URL: http://localhost:3001
    ports:
      - "3000:3000"
      - "9229:9229"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: npm run dev:debug
    networks:
      - ai-agent-dev-network

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: ai-agent-worker-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://aiagent_user:dev_password_123@postgres:5432/aiagent_dev
      REDIS_URL: redis://default:dev_redis_123@redis:6379
      MONGODB_URL: mongodb://admin:dev_mongo_123@mongodb:27017/aiagent_dev
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-dummy-key-for-dev}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-dummy-key}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-dummy-key}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: npm run worker:dev
    networks:
      - ai-agent-dev-network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    container_name: ai-agent-frontend-dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3000
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_dummy}
    ports:
      - "3001:3001"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_started
    networks:
      - ai-agent-dev-network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  mongodb_dev_data:
    driver: local

networks:
  ai-agent-dev-network:
    driver: bridge