# enterprise-ai-agent-platform/.github/workflows/ci.yml
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '24'
  GO_VERSION: '1.21'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate package-lock.json files if missing
        run: |
          if [ ! -f "apps/api/package-lock.json" ]; then
            echo "Generating apps/api/package-lock.json..."
            cd apps/api && npm install --package-lock-only --legacy-peer-deps
            cd ../..
          fi
          if [ ! -f "apps/frontend/package-lock.json" ]; then
            echo "Generating apps/frontend/package-lock.json..."
            cd apps/frontend && npm install --package-lock-only --legacy-peer-deps
            cd ../..
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/frontend/package-lock.json

      - name: Install dependencies (API)
        run: cd apps/api && npm ci

      - name: Run ESLint (API)
        run: cd apps/api && npm run lint

      - name: Install dependencies (Frontend)
        run: cd apps/frontend && npm ci

      - name: Run ESLint (Frontend)
        run: cd apps/frontend && npm run lint

      - name: Check TypeScript types (API)
        run: cd apps/api && npm run type-check

      - name: Check TypeScript types (Frontend)
        run: cd apps/frontend && npm run type-check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate package-lock.json files if missing
        run: |
          if [ ! -f "apps/api/package-lock.json" ]; then
            echo "Generating apps/api/package-lock.json..."
            cd apps/api && npm install --package-lock-only --legacy-peer-deps
            cd ../..
          fi
          if [ ! -f "apps/frontend/package-lock.json" ]; then
            echo "Generating apps/frontend/package-lock.json..."
            cd apps/frontend && npm install --package-lock-only --legacy-peer-deps
            cd ../..
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/frontend/package-lock.json

      - name: Install dependencies (API)
        run: cd apps/api && npm ci

      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb

      - name: Run database migrations
        run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb

      - name: Run unit tests
        run: cd apps/api && npm test
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_key_1234567890
          JWT_REFRESH_SECRET: test_refresh_key_1234567890
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef

      - name: Upload test coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./apps/api/coverage
          flags: api
          name: api-tests

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          command: test
          json: true
