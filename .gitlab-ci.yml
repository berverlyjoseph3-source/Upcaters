# enterprise-ai-agent-platform/.gitlab-ci.yml
stages:
  - lint
  - test
  - build
  - security
  - deploy-staging
  - deploy-production
  - cleanup

variables:
  NODE_VERSION: "20"
  DOCKER_REGISTRY: ${CI_REGISTRY}
  DOCKER_IMAGE_API: ${CI_REGISTRY_IMAGE}/api
  DOCKER_IMAGE_WORKER: ${CI_REGISTRY_IMAGE}/worker
  DOCKER_IMAGE_FRONTEND: ${CI_REGISTRY_IMAGE}/frontend

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - apps/api/node_modules/
    - apps/frontend/node_modules/

# ============================================
# Lint Stage
# ============================================

lint:api:
  stage: lint
  image: node:${NODE_VERSION}
  script:
    - cd apps/api
    - npm ci
    - npm run lint
    - npm run type-check
  artifacts:
    expire_in: 1 hour
    paths:
      - apps/api/node_modules/

lint:frontend:
  stage: lint
  image: node:${NODE_VERSION}
  script:
    - cd apps/frontend
    - npm ci
    - npm run lint
    - npm run type-check
  artifacts:
    expire_in: 1 hour
    paths:
      - apps/frontend/node_modules/

# ============================================
# Test Stage
# ============================================

test:api:
  stage: test
  image: node:${NODE_VERSION}
  services:
    - postgres:15
    - redis:7-alpine
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    DATABASE_URL: postgresql://testuser:testpass@postgres:5432/testdb
    REDIS_URL: redis://redis:6379
  script:
    - cd apps/api
    - npm ci
    - npx prisma generate
    - npx prisma migrate deploy
    - npm test
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    expire_in: 1 week
    paths:
      - apps/api/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/api/coverage/cobertura-coverage.xml

test:frontend:
  stage: test
  image: node:${NODE_VERSION}
  script:
    - cd apps/frontend
    - npm ci
    - npm test
  artifacts:
    expire_in: 1 week
    paths:
      - apps/frontend/coverage/

test:integration:
  stage: test
  image: node:${NODE_VERSION}
  services:
    - postgres:15
    - redis:7-alpine
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    DATABASE_URL: postgresql://testuser:testpass@postgres:5432/testdb
    REDIS_URL: redis://redis:6379
  script:
    - cd apps/api
    - npm ci
    - npx prisma generate
    - npx prisma migrate deploy
    - npm run test:integration
  artifacts:
    expire_in: 1 week
    paths:
      - apps/api/test-results/

# ============================================
# Build Stage
# ============================================

build:api:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - docker build --pull -t ${DOCKER_IMAGE_API}:${CI_COMMIT_SHA} -t ${DOCKER_IMAGE_API}:latest -f apps/api/Dockerfile ./apps/api
    - docker push ${DOCKER_IMAGE_API}:${CI_COMMIT_SHA}
    - docker push ${DOCKER_IMAGE_API}:latest
  only:
    - main
    - develop

build:worker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - docker build --pull -t ${DOCKER_IMAGE_WORKER}:${CI_COMMIT_SHA} -t ${DOCKER_IMAGE_WORKER}:latest -f apps/api/Dockerfile.worker ./apps/api
    - docker push ${DOCKER_IMAGE_WORKER}:${CI_COMMIT_SHA}
    - docker push ${DOCKER_IMAGE_WORKER}:latest
  only:
    - main
    - develop

build:frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - docker build --pull -t ${DOCKER_IMAGE_FRONTEND}:${CI_COMMIT_SHA} -t ${DOCKER_IMAGE_FRONTEND}:latest -f apps/frontend/Dockerfile ./apps/frontend
    - docker push ${DOCKER_IMAGE_FRONTEND}:${CI_COMMIT_SHA}
    - docker push ${DOCKER_IMAGE_FRONTEND}:latest
  only:
    - main
    - develop

# ============================================
# Security Stage
# ============================================

security:trivy:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 1 --no-progress .
  only:
    - main

security:snyk:
  stage: security
  image: node:${NODE_VERSION}
  before_script:
    - npm install -g snyk
    - snyk auth ${SNYK_TOKEN}
  script:
    - cd apps/api && snyk test --severity-threshold=high
    - cd ../frontend && snyk test --severity-threshold=high
  only:
    - main

# ============================================
# Deploy Stage
# ============================================

deploy:staging:
  stage: deploy-staging
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
    - curl -LO https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl
    - chmod +x ./kubectl && mv ./kubectl /usr/local/bin/kubectl
    - mkdir -p ~/.kube
    - echo ${KUBECONFIG_STAGING} | base64 -d > ~/.kube/config
  script:
    - kubectl set image deployment/ai-agent-platform-api api=${DOCKER_IMAGE_API}:${CI_COMMIT_SHA} -n ai-agent-platform-staging
    - kubectl set image deployment/ai-agent-platform-worker worker=${DOCKER_IMAGE_WORKER}:${CI_COMMIT_SHA} -n ai-agent-platform-staging
    - kubectl set image deployment/ai-agent-platform-frontend frontend=${DOCKER_IMAGE_FRONTEND}:${CI_COMMIT_SHA} -n ai-agent-platform-staging
    - kubectl rollout status deployment/ai-agent-platform-api -n ai-agent-platform-staging --timeout=5m
    - kubectl rollout status deployment/ai-agent-platform-worker -n ai-agent-platform-staging --timeout=5m
    - kubectl rollout status deployment/ai-agent-platform-frontend -n ai-agent-platform-staging --timeout=5m
  only:
    - develop
  environment:
    name: staging
    url: https://staging.aiagentplatform.com

deploy:production:
  stage: deploy-production
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
    - curl -LO https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl
    - chmod +x ./kubectl && mv ./kubectl /usr/local/bin/kubectl
    - mkdir -p ~/.kube
    - echo ${KUBECONFIG_PRODUCTION} | base64 -d > ~/.kube/config
  script:
    - kubectl set image deployment/ai-agent-platform-api api=${DOCKER_IMAGE_API}:${CI_COMMIT_SHA} -n ai-agent-platform-production
    - kubectl set image deployment/ai-agent-platform-worker worker=${DOCKER_IMAGE_WORKER}:${CI_COMMIT_SHA} -n ai-agent-platform-production
    - kubectl set image deployment/ai-agent-platform-frontend frontend=${DOCKER_IMAGE_FRONTEND}:${CI_COMMIT_SHA} -n ai-agent-platform-production
    - kubectl rollout status deployment/ai-agent-platform-api -n ai-agent-platform-production --timeout=10m
    - kubectl rollout status deployment/ai-agent-platform-worker -n ai-agent-platform-production --timeout=10m
    - kubectl rollout status deployment/ai-agent-platform-frontend -n ai-agent-platform-production --timeout=10m
  only:
    - main
  environment:
    name: production
    url: https://app.aiagentplatform.com
  when: manual

# ============================================
# Cleanup Stage
# ============================================

cleanup:images:
  stage: cleanup
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - |
      for image in ${DOCKER_IMAGE_API} ${DOCKER_IMAGE_WORKER} ${DOCKER_IMAGE_FRONTEND}; do
        curl -s -X DELETE -H "Authorization: Bearer ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories/$(echo ${image} | cut -d'/' -f2)/tags?tag_regex=.*"
      done
  only:
    - main
  when: manual