# enterprise-ai-agent-platform/docker-compose.staging.yml
version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-agent-postgres-staging
    restart: always
    environment:
      POSTGRES_DB: aiagent_staging
      POSTGRES_USER: ${DB_USER:-aiagent_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aiagent_user} -d aiagent_staging"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ai-agent-staging-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis-staging
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ai-agent-staging-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  mongodb:
    image: mongo:7
    container_name: ai-agent-mongodb-staging
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: aiagent_staging
    volumes:
      - mongodb_staging_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ai-agent-staging-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: ai-agent-platform/api:staging
    container_name: ai-agent-api-staging
    restart: always
    environment:
      NODE_ENV: staging
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-aiagent_user}:${DB_PASSWORD}@postgres:5432/aiagent_staging
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongodb:27017/aiagent_staging
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      TWITTER_API_KEY: ${TWITTER_API_KEY}
      TWITTER_API_SECRET: ${TWITTER_API_SECRET}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      APP_URL: https://staging.aiagentplatform.com
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - ai-agent-staging-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    image: ai-agent-platform/worker:staging
    container_name: ai-agent-worker-staging
    restart: always
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://${DB_USER:-aiagent_user}:${DB_PASSWORD}@postgres:5432/aiagent_staging
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongodb:27017/aiagent_staging
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - ai-agent-staging-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    image: ai-agent-platform/frontend:staging
    container_name: ai-agent-frontend-staging
    restart: always
    environment:
      VITE_API_URL: https://staging-api.aiagentplatform.com
      VITE_WS_URL: wss://staging-api.aiagentplatform.com
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    depends_on:
      api:
        condition: service_started
    networks:
      - ai-agent-staging-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local
  mongodb_staging_data:
    driver: local

networks:
  ai-agent-staging-network:
    driver: bridge